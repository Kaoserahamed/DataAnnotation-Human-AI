version: 2

updates:
  # ── Root workspace (tooling: eslint, prettier, typescript, vitest) ──────────
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    groups:
      # Batch all eslint-related updates into one PR
      eslint:
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
      # Batch all vitest / coverage updates together
      vitest:
        patterns:
          - "vitest"
          - "@vitest/*"
      # Batch TypeScript toolchain together
      typescript:
        patterns:
          - "typescript"
          - "@types/*"

  # ── apps/api workspace (fastify, pg, jose, zod …) ───────────────────────────
  - package-ecosystem: "npm"
    directory: "/apps/api"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps/api)"
      include: "scope"
    groups:
      fastify:
        patterns:
          - "fastify"
          - "@fastify/*"
      database:
        patterns:
          - "pg"
          - "@types/pg"
          - "@electric-sql/*"

  # ── packages/shared workspace (zod) ─────────────────────────────────────────
  - package-ecosystem: "npm"
    directory: "/packages/shared"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore(deps/shared)"
      include: "scope"

  # ── GitHub Actions versions ──────────────────────────────────────────────────
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "ci(deps)"
      include: "scope"
